<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>TOW is updating</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8f9fb;
        color: #101827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
        background:
          radial-gradient(circle at 15% 15%, rgb(242 165 121 / 22%), transparent 32rem),
          #f8f9fb;
      }

      main {
        width: min(100%, 36rem);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #e3e7ed;
        border-radius: 1rem;
        background: rgb(255 255 255 / 92%);
        box-shadow: 0 24px 64px -24px rgb(14 23 42 / 24%);
        text-align: center;
      }

      svg {
        width: 4.5rem;
        height: auto;
      }

      h1 {
        margin: 1.5rem 0 0.75rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        letter-spacing: -0.04em;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #596477;
        font-size: 1rem;
        line-height: 1.65;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0e172a;
          color: #f5f7fa;
        }

        body {
          background:
            radial-gradient(circle at 15% 15%, rgb(218 94 44 / 20%), transparent 32rem),
            #0e172a;
        }

        main {
          border-color: #29354a;
          background: rgb(25 35 53 / 94%);
          box-shadow: 0 24px 64px -24px rgb(0 0 0 / 70%);
        }

        p {
          color: #b8c0cc;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 249 245" role="img" aria-label="TOW">
        <path d="M31 25c-5.5 0-10 4.5-10 10v51.5c0 4.7 2.4 9 6.4 11.5l54.3 34c2.4 1.5 5 2.3 7.7 2.3 5.5 0 10-3.8 10.6-9.3.4-4.3 1.1-8.6 4.2-12.4 2.6-3.1 6-5.2 11.8-9.2v-24c0-4.3-2.3-8.3-6.1-10.5L38.3 28.2C36.1 26.9 33.6 25 31 25Z" fill="#f2a579"/>
        <path d="M218 25c5.5 0 10 4.5 10 10v51.5c0 4.7-2.4 9-6.4 11.5l-54.3 34c-2.4 1.5-5 2.3-7.7 2.3-5.5 0-10-3.8-10.6-9.3-.4-4.3-1.1-8.6-4.2-12.4-2.6-3.1-6-5.2-11.8-9.2v-24c0-4.3 2.3-8.3 6.1-10.5l71.6-40.7c2.2-1.3 4.7-3.2 7.3-3.2Z" fill="#9f3f1a"/>
        <rect x="107.5" y="117.5" width="34" height="31" rx="7.5" fill="#0e172a"/>
        <path d="M95.5 152.5c3.3-2.4 7.3-2.4 10.6.1 5.1 3.8 10.7 5.1 18.4 5.1s13.3-1.3 18.4-5.1c3.3-2.5 7.3-2.5 10.6-.1l11.5 8.3c5.8 4.2 9 10.7 9 17.8v15.8c0 6.7-3.7 12.8-9.6 15.9l-30 15.8c-6.2 3.3-13.6 3.3-19.8 0l-30-15.8c-5.9-3.1-9.6-9.2-9.6-15.9v-15.8c0-7.1 3.2-13.6 9-17.8Z" fill="#da5e2c"/>
      </svg>
      <h1>We’ll be right back</h1>
      <p>TOW is applying an update. Your workspace will be available again as soon as it finishes.</p>
    </main>
  </body>
</html>
